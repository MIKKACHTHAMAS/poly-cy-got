services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"


  frontend:
    image: node:22

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    command:
      - npm
      - run
      - dev
      - --host
      - 0.0.0.0